<title>RealtorHelper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#F1F3F6;--surface-3:#E6E9EE;--text:#111827;--text-2:#4B5563;--muted:#8A93A3;--border:#E3E6EB;--accent:#2F5BEA;--accent-soft:#ECF0FE;--ink:#111827;--on-ink:#FFFFFF;--ph-filter:none;--map:#ECEEF1;--map-road:#FFFFFF;--map-park:#DFE6DE;--device:#0B0D10;--scrim:rgba(15,20,30,.42);--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0D1015;--surface:#141920;--surface-2:#1B212A;--surface-3:#252C37;--text:#E7EAF0;--text-2:#AEB5C1;--muted:#7C8594;--border:#262D38;--accent:#86A2FF;--accent-soft:#1B2540;--ink:#E7EAF0;--on-ink:#0D1015;--ph-filter:brightness(.52) saturate(.75);--map:#171C24;--map-road:#242B36;--map-park:#1C2620;--device:#000;--scrim:rgba(0,0,0,.6);--shadow:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D1015;--surface:#141920;--surface-2:#1B212A;--surface-3:#252C37;--text:#E7EAF0;--text-2:#AEB5C1;--muted:#7C8594;--border:#262D38;--accent:#86A2FF;--accent-soft:#1B2540;--ink:#E7EAF0;--on-ink:#0D1015;--ph-filter:brightness(.52) saturate(.75);--map:#171C24;--map-road:#242B36;--map-park:#1C2620;--device:#000;--scrim:rgba(0,0,0,.6);--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;font-weight:600;text-wrap:balance}
h3{font-size:16px;font-weight:600}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor}.ic.sm{width:13px;height:13px}.ic.lg{width:20px;height:20px}.ic.xl{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.wrap{flex-wrap:wrap}.row.top{align-items:flex-start}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.sub{color:var(--text-2)}
.small{font-size:12px}.s13{font-size:13px}.b{font-weight:600}.m{font-weight:500}
.upper{text-transform:uppercase;letter-spacing:.05em;font-size:12px;font-weight:600;color:var(--muted)}
.link{color:var(--accent);font-weight:500;font-size:13px}
.link:hover{text-decoration:underline}

/* prototype bar */
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.bar .hint{color:var(--muted);font-size:12px;flex:1;min-width:180px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-weight:500;font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.stage{flex:1;min-height:0;display:flex;gap:24px;padding:16px;justify-content:center}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:500;white-space:nowrap;background:var(--ink);color:var(--on-ink);transition:opacity .15s,background .15s}
.btn:hover{opacity:.88}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.sec:hover{background:var(--surface-2);opacity:1}
.btn.ghost{background:none;color:var(--text)}
.btn.ghost:hover{background:var(--surface-2);opacity:1}
.btn.inv{background:var(--surface);color:var(--text)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.lg{padding:14px 20px;font-size:16px;font-weight:600;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:500;font-size:13px;border:1px solid transparent;white-space:nowrap}
.chip.out{background:var(--surface);border-color:var(--border)}
.chip.lg{padding:9px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.ink{background:var(--ink);color:var(--on-ink)}
.badge.line{background:var(--surface);border:1px solid var(--border)}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.av.ink{background:var(--ink);color:var(--on-ink)}
.av.lg{width:52px;height:52px;font-size:18px}.av.md{width:44px;height:44px;font-size:15px}.av.sm{width:26px;height:26px;font-size:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.tight{padding:16px;gap:12px}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);min-width:0}
.li:last-child{border-bottom:0}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn.on{color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--ink)}
.toggle[aria-checked="true"]::after{left:18px}
.cbx{width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--on-ink);flex:none}
.cbx[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.cbx .ic{width:14px;height:14px;stroke-width:2.4}
.inp{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--surface);min-width:0}
.inp:focus-within{border-color:var(--text-2)}
.inp input,.inp select,.inp textarea{border:0;background:none;outline:none;width:100%;font-weight:500;min-width:0}
.inp textarea{resize:vertical;font-weight:400;min-height:60px;line-height:1.5}
.inp.changed{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:12px;font-weight:500;color:var(--text-2)}
.hintline{font-size:11px;color:var(--muted)}
.hintline.on{color:var(--text)}

/* photos */
.media{position:relative;overflow:hidden}
.ph{background:linear-gradient(135deg,var(--a),var(--b));filter:var(--ph-filter);display:grid;place-items:center;color:#fff;width:100%;height:100%}
.ph .ic{width:26%;height:auto;aspect-ratio:1;max-width:60px;opacity:.78;stroke-width:1.3}
.t0{--a:#D9DEE5;--b:#A9B4C2}.t1{--a:#E5E1DB;--b:#BFB7AC}.t2{--a:#DCE3DE;--b:#AEBDB4}.t3{--a:#E2DFE7;--b:#B8B1C4}.t4{--a:#DCE3E9;--b:#A3B2C0}.t5{--a:#E7E3DD;--b:#C8BFB3}
.ov{position:absolute;top:10px;display:flex;gap:6px;align-items:center}
.ov.l{left:10px}.ov.r{right:10px}.ov.br{top:auto;bottom:10px;right:10px}
.fit{background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 8px;font-size:12px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.fit b{color:var(--accent);font-weight:700}.fit.low b{color:var(--text-2)}
.fit.deal{color:var(--text)}

/* agent app */
.agent{flex:1;min-width:0;max-width:1480px;display:grid;grid-template-columns:224px minmax(0,1fr);background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;height:100%;position:relative}
.a-side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;gap:22px;min-height:0}
.a-nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--text-2);font-weight:500;width:100%}
.nav-i:hover{background:var(--surface-2)}
.nav-i[aria-current="page"]{background:var(--surface-2);color:var(--text);font-weight:600}
.nav-i .badge{margin-left:auto}
.a-side .fill{flex:1}
.me{display:flex;gap:10px;align-items:center;padding:14px 8px 0;border-top:1px solid var(--border)}
.a-col{display:flex;flex-direction:column;min-width:0;min-height:0}
.a-top{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:8px 12px;color:var(--muted);width:min(420px,100%)}
.search input{border:0;background:none;outline:none;width:100%;color:var(--text)}
.bell{position:relative}
.bell .n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.a-main{flex:1;overflow:auto;padding:26px 28px 48px;display:flex;flex-direction:column;gap:20px}
.a-main>*{flex-shrink:0}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.crumb button:hover{color:var(--text)}
.crumb span{color:var(--text-2);font-weight:500}
.metas{gap:18px;font-size:13px;color:var(--text-2)}
.meta{display:inline-flex;gap:6px;align-items:center}.meta .ic{color:var(--muted);width:14px;height:14px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{padding:0 0 10px;border-bottom:2px solid transparent;color:var(--text-2);font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{border-color:var(--ink);color:var(--text);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.02em}
.bar-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--ink);border-radius:4px}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{background:var(--surface-2);text-align:left;font-size:12px;font-weight:500;color:var(--text-2);padding:11px 14px;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.selbar{background:var(--ink);color:var(--on-ink);border-radius:10px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.selbar .btn{background:var(--surface);color:var(--text)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
.lcard:hover{box-shadow:var(--shadow)}
.lcard.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lcard.dim .media,.lcard.dim .lbody{opacity:.55}
.lcard .media{aspect-ratio:5/3}
.lbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:3px}
.price{font-size:18px;font-weight:600;letter-spacing:-.01em}
.lfoot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);margin-top:9px;padding-top:10px;font-size:13px;color:var(--text-2)}
.love{color:var(--accent)}
.pf{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);min-width:0}
.pf:last-child{border-bottom:0}
.imp{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.imp.must{background:var(--ink);color:var(--on-ink)}
.imp.nice{background:var(--surface-2);color:var(--text-2)}
.imp.off{background:var(--surface);border:1px dashed var(--border);color:var(--muted)}
.imp.never{background:var(--surface);border-color:var(--ink);color:var(--text)}
button.imp:hover{filter:brightness(.95)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;height:28px}
.stepper button{width:26px;height:26px;display:grid;place-items:center;color:var(--text-2)}
.stepper button:hover{color:var(--text)}
.stepper span{padding:0 6px;font-size:13px;font-weight:600;min-width:22px;text-align:center}
.sugg{border:1px solid var(--ink);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.quote{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text-2)}
.pt textarea{min-height:96px}
.pt.rec{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn.mic.on{border-color:var(--accent);color:var(--accent)}
.btn.mic.on .ic{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.ptchips .chip{white-space:normal;text-align:left}
.ptrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.ptrow:last-child{border-bottom:0}
.ptrow input{margin-top:3px;width:16px;height:16px;accent-color:var(--ink);flex:none;cursor:pointer}
.ptrow.off .col{opacity:.5}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.ai{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.aitag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.aisum{background:var(--surface-2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.55}
.aitbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.aitbl{border-collapse:collapse;width:100%;min-width:720px;table-layout:fixed}
.aitbl th,.aitbl td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.aitbl tr:last-child td,.aitbl tr:last-child th{border-bottom:0}
.aitbl thead td{background:var(--surface-2)}
.aitbl th[scope="row"]{width:150px;font-weight:600;font-size:13px}
.aiscore{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.aiscore b{font-size:18px;font-variant-numeric:tabular-nums;min-width:30px}
.aiscore b.hi{color:var(--accent)}
.aiscore b.lo{color:var(--muted)}
.aibar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:40px}
.aibar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.aibar i.lo{background:var(--muted)}
.aitxt{font-size:13px;color:var(--text-2);line-height:1.5}
.aiadj{display:inline-flex;gap:4px;align-items:flex-start;margin-top:6px;font-size:11px;color:var(--accent);font-weight:500}
.aiadj.neg{color:var(--text-2)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.aihome{border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.aicrow{display:flex;flex-direction:column;gap:2px}
.reqcard{text-align:left;align-self:flex-start;max-width:88%;min-width:min(340px,100%);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.reqcard.me{align-self:flex-end}
.reqcard.done{border-left-color:var(--border)}
.reqcard ul{margin:0;padding-left:18px;font-size:13px;color:var(--text-2)}
.reqlist{display:flex;flex-direction:column;gap:0;border:1px solid var(--accent);border-radius:12px;padding:4px 14px;background:var(--surface)}
.menuwrap{position:relative;flex:none}
.popmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:25;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.popmenu button{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;text-align:left;width:100%}
.popmenu button:hover,.popmenu button:focus-visible{background:var(--surface-2)}
.popmenu .ic{margin-top:2px}
.warn ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.gallery{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;height:380px}
.gallery .media{border-radius:12px}
.gallery .side{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.facts{display:flex;gap:28px;flex-wrap:wrap}
.fact .v{font-size:16px;font-weight:600}
.crit{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.crit:last-child{border-bottom:0}
.cdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text-2)}
.cdot.ok{background:var(--ink);color:var(--on-ink)}
.cdot.no{background:var(--surface);border:1px solid var(--border)}
.cdot .ic{width:13px;height:13px;stroke-width:2.2}
.fitbig{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.fitbig.low{background:var(--surface-2);color:var(--text-2)}
.reacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--text-2)}
.rbtn.h{flex-direction:row;justify-content:center;gap:6px;font-size:13px}
.rbtn:hover{background:var(--surface-2)}
.rbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.rbtn[disabled]{cursor:default}
.rbtn[disabled]:hover{background:var(--surface)}

 {k:'noHighway',on:c=>c.noHighway,test:l=>!l.highway,label:()=>'Not near I-94',why:()=>'Near highway I-94'}];
function runSearch(c){
 const all=S.listings;const steps=[{label:'Active listings',n:all.length}];let cur=all;
 for(const f of FILTERS){if(!f.on(c))continue;const before=cur.length;cur=cur.filter(l=>f.test(l,c));steps.push({k:f.k,label:f.label(c),n:cur.length,cut:before-cur.length});}
 const act=FILTERS.filter(f=>f.on(c));
 const near=all.filter(l=>!cur.includes(l)).map(l=>{const fails=act.filter(f=>!f.test(l,c));return fails.length===1?{l,why:fails[0].why(l,c),k:fails[0].k}:null;}).filter(Boolean).sort((a,b)=>fit(b.l).score-fit(a.l).score);
 return{results:[...cur].sort((a,b)=>fit(b).score-fit(a).score),steps,near};}
const isNew=l=>l.dom<=7;
function newMatches(s){return runSearch(criteriaOf(s)).results.filter(l=>!l.onBoard&&isNew(l)&&!s.hidden.includes(l.id));}
function allNewMatches(){const seen=new Set(),out=[];for(const s of S.searches)for(const l of newMatches(s))if(!seen.has(l.id)){seen.add(l.id);out.push(l);}return out.sort((a,b)=>fit(b).score-fit(a).score);}

function newPrefSearch(by){const n=S.searches.filter(x=>x.fromPrefs).length;const s={id:'s'+Date.now(),name:'Alex — preferences'+(n?` ${n+1}`:''),synced:false,fromPrefs:true,criteria:JSON.parse(JSON.stringify(prefCriteria())),alerts:'daily',mode:'curated',by,hidden:[],t:Date.now()};S.searches.unshift(s);log(by,'created a search from preferences');return s;}

function tourTimes(T=S.tour){let t=T.start,prev=0;const out=[];for(const id of T.stops){const d=drive(prev,id);t+=d;out.push({id,drive:d,at:t});t+=30;prev=id;}return{stops:out,end:t,driveTotal:out.reduce((a,b)=>a+b.drive,0)};}
const hm=m=>{const h=Math.floor(m/60),mm=m%60,ap=h>=12?'pm':'am',h12=((h+11)%12)+1;return `${h12}:${String(mm).padStart(2,'0')} ${ap}`;};
function nnOrder(ids){const left=[...ids],out=[];let cur=0;while(left.length){left.sort((a,b)=>drive(cur,a)-drive(cur,b));cur=left.shift();out.push(cur);}return out;}

function cycleImp(k,who){
 const p=S.prefs[k];if(who==='client'&&p.lock){toast('Maya locked this one. Tap it to suggest a change.');return;}

 S.prefHistory.unshift({who,text:`${lbl} → ${IMPL[p.imp]}`,t:Date.now()});
 if(who==='client'){log('client',`changed ${lbl} to ${IMPL[p.imp]}`);clientPrefChanged(k,`${lbl}: ${IMPL[order[(order.indexOf(p.imp)+order.length-1)%order.length]]} → ${IMPL[p.imp]}`);ping('Maya gets a to-do to review it');}
}

 react:d=>{const l=L(+d.id);const v=d.v;const was=l.reaction;l.reaction=was===v?null:v;

  if(l.reaction){log('client',`${{love:'loved',like:'liked',maybe:'said maybe to',pass:'passed on'}[l.reaction]} ${l.addr}`);if(l.reaction!=='pass')ping(`Maya sees Alex’s reaction on ${l.addr}`);}},

  if('min' in D&&D.min>D.max){toast('Min must be below max');return;}
  if((k==='areas'||k==='type')&&!D.v.length){toast('Pick at least one');return;}
  const from={},to={};for(const f of ['v','min','max','imp'])if(f in D&&JSON.stringify(D[f])!==JSON.stringify(p[f])){from[f]=JSON.parse(JSON.stringify(p[f]));to[f]=JSON.parse(JSON.stringify(D[f]));}
  if(!p.lock&&Object.keys(to).length){const text=`${lbl}: ${sgDesc({k,from,to})}`;Object.assign(p,JSON.parse(JSON.stringify(to)));S.prefHistory.unshift({who:'client',text,t:Date.now()});log('client',`changed ${lbl}`);clientPrefChanged(k,text);S.c.sheet=null;toast('Saved — Maya was notified');ping('Maya gets a to-do to review it');return;}
  const old=sh.pending&&S.suggestions.find(x=>x.id===sh.pending);

  if(old){old.from=from;old.to=to;old.note=sh.note||'';old.t=Date.now();S.prefHistory.unshift({who:'client',text:`Updated suggestion ${lbl}: ${sgDesc(old)}`,t:Date.now()});S.c.sheet=null;toast('Suggestion updated');return;}
  const g='g'+Date.now(),sg={id:'sg'+Date.now(),g,k,from,to,note:sh.note||'',status:'pending',t:Date.now()};S.suggestions.push(sg);
  S.prefHistory.unshift({who:'client',text:`Suggested ${lbl}: ${sgDesc(sg)}`,t:Date.now()});log('client',`suggested a change to ${lbl}`);pushReq('prefs',g);
  S.c.sheet=null;toast('Suggestion sent to Maya');ping('Maya sees the suggestion in Messages and on Preferences');},

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const fn=A[el.dataset.act];if(!fn)return;
 if(el.dataset.act.endsWith('-bg')&&e.target!==el)return;
 fn(el.dataset,e);render();
});
document.addEventListener('click',e=>{if(S.a.newSearch&&!e.target.closest('.menuwrap')){S.a.newSearch=false;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.a.newSearch){S.a.newSearch=false;render();return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-act],div[data-act][role="button"]')){e.preventDefault();e.target.click();}if(e.key==='Escape'){if(S.c.sheet){S.c.sheet=null;render();}else if(S.a.modal){S.a.modal=null;render();}}});
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 const text=(new FormData(f).get('text')||'').toString().trim();if(!text)return;
 const k=f.dataset.form;
 if(k==='comment'){const id=+f.dataset.id,who=f.dataset.who;(S.comments[id]=S.comments[id]||[]).push({who,text,t:Date.now(),priv:who==='agent'&&S.a.privateNote});
  if(who==='client'){if(!S.unseenComments.includes(id))S.unseenComments.push(id);log('client',`commented on ${L(id).addr}`);ping('Maya sees the comment');}else if(!S.a.privateNote){log('agent',`replied on ${L(id).addr}`);ping('Alex sees your reply');}}
 if(k==='chat'){const who=f.dataset.who;S.messages.push({who,text,t:Date.now()});if(who==='client')S.unread.agent++;else S.unread.client++;}
 if(k==='note'){S.notes.unshift({text,t:Date.now()});}
 render();const again=document.getElementById(f.querySelector('input').id);if(again)again.focus();
});
function onInput(e){
 const el=e.target;const b=el.dataset.input;if(!b)return;
 if(b==='clientSearch'){S.a.clientSearch=el.value;render();}
 else if(b==='afb'){const id=+el.dataset.id;S.agentFb[id]={...(S.agentFb[id]||{}),note:el.value};if(e.type==='change')render();}
 else if(b==='plan'){const k=el.dataset.k;S.a.plan[k]=k==='start'?+el.value:el.value;render();}
 else if(b==='sort'){S.a.sort=el.value;render();}
 else if(b==='status'){L(+el.dataset.id).status=el.value;render();}
 else if(b==='tourStart'){S.tour.start=+el.value;render();}
 else if(b==='tourAdd'){if(el.value){A['tour-add']({id:el.value});render();}}
 else if(b==='sheet'){S.c.sheet[el.dataset.k]=el.value;}
 else if(b==='psheet'){const v=parseInt(String(el.value).replace(/\D/g,''),10);if(!isNaN(v))S.c.sheet.d[el.dataset.k]=v;if(e.type==='change')render();}
 else if(b==='ptText'){S.a.ptText=el.value;render();}
 else if(b==='scName'){curSearch().name=el.value||'Untitled search';if(e.type==='change')render();}
 else if(b==='scAlerts'){curSearch().alerts=el.value;render();}
 else if(b==='scMode'){const s=curSearch();s.mode=el.value;if(s.mode==='auto'){const nm=newMatches(s);for(const l of nm){l.onBoard=true;l.addedBy='agent';l.status='New';}if(nm.length){log('agent',`auto-sent ${nm.length} new matches`);toast(`${nm.length} new matches sent to Alex`);}}render();}
 else if(b==='scPrice'){const c=editable(curSearch());const v=parseInt(el.value.replace(/\D/g,''),10);const cur=c.price?[...c.price]:[0,9999999];cur[+el.dataset.k]=v||(+el.dataset.k?9999999:0);if(cur[0]===0&&cur[1]===9999999)delete c.price;else c.price=cur;render();}
 else if(b==='offer'){const k=el.dataset.k;if(k==='price'||k==='earnest'){const v=parseInt(el.value.replace(/\D/g,''),10);if(v)S.offer[k]=v;if(e.type==='change')render();}else{S.offer[k]=el.value;if(e.type==='change'&&k==='closing')render();}}
}
document.addEventListener('input',e=>{const b=e.target.dataset.input;if(['clientSearch','sheet','psheet','offer','scName','ptText','afb'].includes(b))onInput(e);});
document.addEventListener('change',e=>{const b=e.target.dataset.input;if(!['clientSearch','weight','sheet','ptText'].includes(b))onInput(e);});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,120);});
render();
</script>
